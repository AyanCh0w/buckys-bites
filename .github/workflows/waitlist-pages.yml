name: Publish waitlist to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'landing-page/**'
      - '.github/workflows/waitlist-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: waitlist-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.has_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: landing-page
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
